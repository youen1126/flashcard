<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✦ FLASHCARD STUDIO ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:   #ff2d78;
      --blue:   #00cfff;
      --lime:   #b8ff00;
      --purple: #9d00ff;
      --bg:     #04000f;
      --glass:  rgba(255,255,255,0.06);
      --glass-b:rgba(255,255,255,0.14);
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient glow + grid */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 10% 30%, rgba(157,0,255,.18) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 10%, rgba(0,207,255,.18) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 90%, rgba(255,45,120,.12) 0%, transparent 50%),
        linear-gradient(rgba(0,207,255,.035) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(90deg, rgba(0,207,255,.035) 1px, transparent 1px) 0 0 / 48px 48px;
    }

    /* CRT scanline overlay */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,.06) 3px,
        rgba(0,0,0,.06) 4px
      );
    }

    #app {
      position: relative; z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* ── TYPOGRAPHY ── */
    .chrome-text {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      background: linear-gradient(135deg, #b0b0b0 0%, #fff 28%, #a0c8ff 52%, #fff 72%, #b0b0b0 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: 3px;
    }
    .neon-blue {
      color: var(--blue);
      text-shadow: 0 0 8px var(--blue), 0 0 22px rgba(0,207,255,.5);
    }
    .neon-pink {
      color: var(--pink);
      text-shadow: 0 0 8px var(--pink), 0 0 22px rgba(255,45,120,.5);
    }

    /* ── HEADER ── */
    .site-header { text-align: center; padding: 48px 0 36px; }

    .logo-line1 {
      font-family: 'Orbitron', monospace; font-weight: 900;
      font-size: clamp(28px, 6vw, 52px); letter-spacing: 4px; line-height: 1;
      background: linear-gradient(135deg, #c0c0c0 0%, #fff 28%, #a0d4ff 52%, #fff 72%, #c0c0c0 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-pink-part {
      background: linear-gradient(135deg, #ff2d78, #ff8fb0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-line2 {
      font-family: 'Orbitron', monospace; font-weight: 900;
      font-size: clamp(26px, 5.5vw, 46px); letter-spacing: 6px;
      background: linear-gradient(135deg, #b8ff00, #00cfff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-top: 2px;
    }
    .site-tagline {
      font-family: 'Orbitron', monospace; font-size: 10px;
      letter-spacing: 5px; color: rgba(255,255,255,.35);
      margin-top: 14px; text-transform: uppercase;
    }

    .star-pink { color: var(--pink); text-shadow: 0 0 10px var(--pink); display: inline-block; }
    .star-blue { color: var(--blue); text-shadow: 0 0 10px var(--blue); display: inline-block; }
    .star-lime { color: var(--lime); text-shadow: 0 0 10px var(--lime); display: inline-block; }

    @keyframes spin-slow  { to { transform: rotate(360deg); } }
    @keyframes blink      { 0%,100%{opacity:1} 50%{opacity:.25} }
    @keyframes float-up   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes holo-shift { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }

    .spin   { animation: spin-slow 5s linear infinite; }
    .blink  { animation: blink 1.8s ease-in-out infinite; }
    .float  { animation: float-up 3.2s ease-in-out infinite; }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      margin: 28px 0;
    }

    /* ── GLASS SURFACE ── */
    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 18px;
      backdrop-filter: blur(16px);
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px; border-radius: 10px; border: none; cursor: pointer;
      font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      transition: all .2s; position: relative; overflow: hidden; white-space: nowrap;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .btn-pink {
      background: linear-gradient(135deg, #ff2d78, #ff6b9d); color: #fff;
      box-shadow: 0 4px 18px rgba(255,45,120,.45), inset 0 1px 0 rgba(255,255,255,.2);
    }
    .btn-pink:hover  { box-shadow: 0 6px 30px rgba(255,45,120,.75); transform: translateY(-2px); }
    .btn-pink:active { transform: translateY(0); }

    .btn-blue {
      background: linear-gradient(135deg, #00bfea, #0070ff); color: #fff;
      box-shadow: 0 4px 18px rgba(0,207,255,.45), inset 0 1px 0 rgba(255,255,255,.2);
    }
    .btn-blue:hover  { box-shadow: 0 6px 30px rgba(0,207,255,.75); transform: translateY(-2px); }

    .btn-lime {
      background: linear-gradient(135deg, #b8ff00, #7aff00); color: #000;
      box-shadow: 0 4px 18px rgba(184,255,0,.45), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .btn-lime:hover  { box-shadow: 0 6px 30px rgba(184,255,0,.75); transform: translateY(-2px); }

    .btn-ghost {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.8);
    }
    .btn-ghost:hover { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 18px rgba(0,207,255,.2); }

    .btn-sm { padding: 7px 14px; font-size: 10px; border-radius: 8px; }

    .btn-del {
      width: 34px; height: 34px; border-radius: 8px; border: none; cursor: pointer;
      background: rgba(255,45,120,.1); border: 1px solid rgba(255,45,120,.3);
      color: var(--pink); font-size: 15px; transition: all .2s;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-del:hover { background: rgba(255,45,120,.25); box-shadow: 0 0 16px rgba(255,45,120,.4); }

    /* ── INPUT ── */
    .y2k-input {
      width: 100%;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px; padding: 10px 14px;
      color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 14px;
      transition: all .2s; outline: none; resize: none;
    }
    .y2k-input::placeholder { color: rgba(255,255,255,.25); }
    .y2k-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,207,255,.12), 0 0 20px rgba(0,207,255,.08);
      background: rgba(0,207,255,.04);
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-family: 'Orbitron', monospace; font-size: 10px;
      letter-spacing: 3px; color: rgba(255,255,255,.4);
      text-transform: uppercase; margin-bottom: 14px;
    }

    /* ── DECK LIST ── */
    .deck-list { display: flex; flex-direction: column; gap: 12px; }

    .deck-item {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 22px; border-radius: 14px;
      background: var(--glass); border: 1px solid var(--glass-b);
      transition: all .22s; position: relative; overflow: hidden;
    }
    .deck-item::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(to bottom, var(--blue), var(--purple));
    }
    .deck-item:hover {
      border-color: rgba(0,207,255,.35);
      box-shadow: 0 8px 32px rgba(0,207,255,.12);
      transform: translateX(3px);
    }
    .deck-info { flex: 1; cursor: pointer; min-width: 0; }
    .deck-name { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .deck-meta {
      font-family: 'Orbitron', monospace; font-size: 10px;
      color: rgba(255,255,255,.4); margin-top: 4px; letter-spacing: 1px;
    }
    .deck-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 12px; border-radius: 100px;
      font-family: 'Orbitron', monospace; font-size: 10px;
      font-weight: 700; letter-spacing: 1px;
      background: rgba(0,207,255,.12); border: 1px solid rgba(0,207,255,.35); color: var(--blue);
    }

    /* ── CREATE FORM ── */
    .create-form {
      display: flex; gap: 12px; align-items: center;
      padding: 18px 20px; border-radius: 14px;
      background: rgba(184,255,0,.03); border: 1px dashed rgba(184,255,0,.3);
      margin-bottom: 28px;
    }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 48px 20px; color: rgba(255,255,255,.3); }
    .empty-icon  { font-size: 52px; margin-bottom: 18px; }
    .empty-text  { font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 2px; line-height: 1.8; }

    /* ── BACK BAR ── */
    .back-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
    .page-title {
      font-family: 'Orbitron', monospace; font-size: clamp(14px,3vw,20px);
      font-weight: 700; flex: 1;
    }

    /* ── CARD EDITOR ── */
    .card-editor-list { display: flex; flex-direction: column; gap: 14px; }

    .card-editor-item {
      padding: 16px; border-radius: 14px;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.09);
      display: grid; grid-template-columns: 1fr 1fr 36px;
      gap: 14px; align-items: start; transition: border-color .2s;
    }
    .card-editor-item:hover { border-color: rgba(255,255,255,.18); }

    .field-label {
      font-family: 'Orbitron', monospace; font-size: 9px;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
    }
    .label-front { color: rgba(0,207,255,.6); }
    .label-back  { color: rgba(255,45,120,.6); }

    .add-card-btn {
      border: 2px dashed rgba(0,207,255,.3); background: rgba(0,207,255,.04);
      border-radius: 14px; padding: 18px; width: 100%; cursor: pointer;
      color: var(--blue); font-family: 'Orbitron', monospace; font-size: 11px;
      letter-spacing: 2px; text-align: center; transition: all .2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .add-card-btn:hover {
      border-color: rgba(0,207,255,.7); background: rgba(0,207,255,.08);
      box-shadow: 0 0 28px rgba(0,207,255,.15);
    }

    /* ── PRACTICE ── */
    .practice-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; gap: 14px; flex-wrap: wrap;
    }

    .progress-track {
      flex: 1; height: 6px; min-width: 80px;
      background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink));
      border-radius: 3px; transition: width .4s ease;
    }
    .progress-label {
      font-family: 'Orbitron', monospace; font-size: 12px;
      color: rgba(255,255,255,.5); white-space: nowrap;
    }

    /* Flip card */
    .flip-scene {
      perspective: 1200px; width: 100%;
      cursor: pointer; margin-bottom: 28px; user-select: none;
    }
    .flip-card {
      width: 100%;
      display: grid; grid-template-columns: 1fr;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.4,.2,.2,1);
    }
    .flip-card.flipped { transform: rotateY(180deg); }

    .flip-face {
      grid-column: 1; grid-row: 1;
      border-radius: 22px; backface-visibility: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 36px 44px; text-align: center;
      min-height: 200px;
    }
    .flip-face-front {
      background: linear-gradient(135deg, rgba(0,207,255,.1), rgba(157,0,255,.13));
      border: 1px solid rgba(0,207,255,.38);
      box-shadow: 0 0 40px rgba(0,207,255,.16), inset 0 0 40px rgba(0,207,255,.04);
    }
    .flip-face-back {
      background: linear-gradient(135deg, rgba(255,45,120,.1), rgba(157,0,255,.13));
      border: 1px solid rgba(255,45,120,.38);
      box-shadow: 0 0 40px rgba(255,45,120,.16), inset 0 0 40px rgba(255,45,120,.04);
      transform: rotateY(180deg);
    }
    .flip-side-label {
      font-family: 'Orbitron', monospace; font-size: 9px;
      letter-spacing: 3px; opacity: .4; margin-bottom: 18px; text-transform: uppercase;
    }
    .flip-text {
      font-size: clamp(16px, 3vw, 22px); line-height: 1.7;
      font-weight: 500; white-space: pre-wrap; word-break: break-word;
    }
    .flip-hint {
      margin-top: 20px; font-family: 'Orbitron', monospace; font-size: 9px;
      letter-spacing: 2px; opacity: .3; text-transform: uppercase;
    }

    /* Controls */
    .practice-controls {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      flex-wrap: wrap; margin-bottom: 20px;
    }
    .nav-btn {
      width: 50px; height: 50px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05);
      color: #fff; font-size: 22px; cursor: pointer; transition: all .2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: var(--blue); color: var(--blue);
      box-shadow: 0 0 22px rgba(0,207,255,.3);
    }
    .nav-btn:disabled { opacity: .22; cursor: not-allowed; }

    /* Shuffle toggle */
    .shuffle-row {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: 22px;
    }
    .toggle-pill {
      width: 44px; height: 24px; border-radius: 12px;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
      cursor: pointer; transition: all .25s; position: relative; flex-shrink: 0;
    }
    .toggle-pill.on { background: linear-gradient(90deg, var(--blue), var(--purple)); border-color: transparent; }
    .toggle-pill::after {
      content: ''; position: absolute;
      width: 18px; height: 18px; background: #fff; border-radius: 50%;
      top: 2px; left: 3px; transition: left .25s; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .toggle-pill.on::after { left: 23px; }
    .toggle-label {
      font-family: 'Orbitron', monospace; font-size: 10px;
      letter-spacing: 2px; color: rgba(255,255,255,.5);
    }

    /* Complete */
    .complete-state { text-align: center; padding: 56px 20px; }
    .complete-icon  { font-size: 64px; margin-bottom: 20px; }
    .complete-title {
      font-family: 'Orbitron', monospace; font-size: 26px; font-weight: 900; margin-bottom: 10px;
    }
    .complete-sub { color: rgba(255,255,255,.4); font-size: 14px; margin-bottom: 30px; }
    .complete-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* Deck name inline edit in edit view */
    .deck-name-input {
      background: transparent; border: none; border-bottom: 1px solid rgba(0,207,255,.4);
      color: var(--blue); font-family: 'Orbitron', monospace; font-size: inherit;
      font-weight: 700; outline: none; padding: 2px 4px; min-width: 120px; max-width: 300px;
      text-shadow: 0 0 8px var(--blue);
    }
    .deck-name-input:focus { border-bottom-color: var(--blue); box-shadow: none; }

    /* Mode tabs */
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .mode-tab {
      flex: 1; padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.2);
      background: transparent; color: rgba(255,255,255,.45);
      font-family: 'Orbitron', monospace; font-size: 10px;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
    }
    .mode-tab.active {
      background: rgba(0,207,255,.12); border-color: rgba(0,207,255,.5);
      color: var(--blue); box-shadow: 0 0 16px rgba(0,207,255,.15);
    }
    .mode-tab:not(.active):hover { border-color: rgba(255,255,255,.4); color: rgba(255,255,255,.7); }

    /* Card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px; margin-bottom: 20px;
    }
    @media (max-width: 640px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 400px) { .card-grid { grid-template-columns: 1fr; } }

    .grid-card-scene { perspective: 800px; cursor: pointer; }
    .grid-card {
      display: grid; grid-template-columns: 1fr;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.4,.2,.2,1);
    }
    .grid-card.flipped { transform: rotateY(180deg); }

    .grid-face {
      grid-column: 1; grid-row: 1; border-radius: 14px;
      backface-visibility: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px 14px; text-align: center; min-height: 130px;
    }
    .grid-face-front {
      background: linear-gradient(135deg, rgba(0,207,255,.1), rgba(157,0,255,.12));
      border: 1px solid rgba(0,207,255,.32);
    }
    .grid-face-back {
      background: linear-gradient(135deg, rgba(255,45,120,.1), rgba(157,0,255,.12));
      border: 1px solid rgba(255,45,120,.32);
      transform: rotateY(180deg);
    }
    .grid-card-label {
      font-family: 'Orbitron', monospace; font-size: 8px;
      letter-spacing: 2px; opacity: .35; margin-bottom: 8px; text-transform: uppercase;
    }
    .grid-card-text { font-size: 13px; line-height: 1.55; font-weight: 500; white-space: pre-wrap; word-break: break-word; }

    .btn-speak {
      background: rgba(184,255,0,.08);
      border: 1px solid rgba(184,255,0,.3);
      color: var(--lime); border-radius: 10px; cursor: pointer;
      font-size: 16px; padding: 8px 18px; transition: all .2s;
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 1px;
    }
    .btn-speak:hover { background: rgba(184,255,0,.18); box-shadow: 0 0 18px rgba(184,255,0,.25); }

    .grid-speak {
      margin-top: 10px; background: transparent; border: none;
      color: rgba(255,255,255,.3); font-size: 14px; cursor: pointer;
      transition: color .2s; padding: 2px 6px; border-radius: 6px;
    }
    .grid-speak:hover { color: var(--lime); }

    .btn-clear {
      background: transparent;
      border: 1px solid rgba(255,45,120,.35);
      color: rgba(255,45,120,.6);
      font-family: 'Orbitron', monospace; font-size: 10px;
      font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 9px 20px; border-radius: 10px; cursor: pointer;
      transition: all .2s;
    }
    .btn-clear:hover {
      border-color: var(--pink); color: var(--pink);
      background: rgba(255,45,120,.08);
      box-shadow: 0 0 20px rgba(255,45,120,.25);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,207,255,.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,207,255,.6); }

    /* Responsive */
    @media (max-width: 580px) {
      .card-editor-item { grid-template-columns: 1fr; }
      .card-editor-item > .del-col { justify-self: end; }
      .create-form { flex-direction: column; }
      .deck-actions .badge { display: none; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════
//  STATE
// ═══════════════════════════════════
const state = {
  view: 'home',       // 'home' | 'edit' | 'practice'
  decks: [],
  activeDeckId: null,
  practiceIdx: 0,
  isFlipped: false,
  shuffleOn: false,
  shuffledCards: [],
  practiceMode: 'flip',  // 'flip' | 'grid'
  gridFlipped: {},       // { [cardId]: boolean }
};

// ═══════════════════════════════════
//  PERSISTENCE
// ═══════════════════════════════════
function load() {
  try {
    const raw = localStorage.getItem('y2k_flashcards_v1');
    if (raw) state.decks = JSON.parse(raw);
  } catch (_) {}
}
function save() {
  localStorage.setItem('y2k_flashcards_v1', JSON.stringify(state.decks));
}

// ═══════════════════════════════════
//  HELPERS
// ═══════════════════════════════════
const uid = () => Math.random().toString(36).slice(2, 9);

function getDeck() {
  return state.decks.find(d => d.id === state.activeDeckId) || null;
}
function getPracticeCards() {
  return state.shuffleOn ? state.shuffledCards : getDeck().cards;
}
function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ═══════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════
function goHome() { state.view = 'home'; state.activeDeckId = null; render(); }

function goEdit(id) { state.view = 'edit'; state.activeDeckId = id; render(); }

function goPractice(id) {
  state.view = 'practice'; state.activeDeckId = id;
  state.practiceIdx = 0; state.isFlipped = false;
  state.gridFlipped = {};
  const deck = state.decks.find(d => d.id === id);
  state.shuffledCards = shuffleArr(deck.cards);
  render();
}

// ═══════════════════════════════════
//  DECK ACTIONS
// ═══════════════════════════════════
function createDeck(name) {
  if (!name.trim()) return;
  state.decks.push({ id: uid(), name: name.trim(), cards: [] });
  save(); render();
}
function deleteDeck(id) {
  if (!confirm('確定要刪除這個卡片組？此操作無法復原。')) return;
  state.decks = state.decks.filter(d => d.id !== id);
  save(); render();
}
function updateDeckName(id, val) {
  const d = state.decks.find(d => d.id === id);
  if (d) { d.name = val; save(); }
}

// ═══════════════════════════════════
//  CARD ACTIONS
// ═══════════════════════════════════
function addCard(deckId) {
  const d = state.decks.find(d => d.id === deckId);
  d.cards.push({ id: uid(), front: '', back: '' });
  save(); render();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.front-ta');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 30);
}
function deleteCard(deckId, cardId) {
  const d = state.decks.find(d => d.id === deckId);
  d.cards = d.cards.filter(c => c.id !== cardId);
  save(); render();
}
function updateCard(deckId, cardId, field, val) {
  const d = state.decks.find(d => d.id === deckId);
  const c = d && d.cards.find(c => c.id === cardId);
  if (c) { c[field] = val; save(); }
}

// ═══════════════════════════════════
//  PRACTICE ACTIONS
// ═══════════════════════════════════
function flipCard() {
  state.isFlipped = !state.isFlipped;
  const el = document.querySelector('.flip-card');
  if (el) el.classList.toggle('flipped', state.isFlipped);
}
function nextCard() {
  const total = getPracticeCards().length;
  if (state.practiceIdx <= total - 1) {
    state.practiceIdx++;
    state.isFlipped = false;
    render();
  }
}
function prevCard() {
  if (state.practiceIdx > 0) {
    state.practiceIdx--;
    state.isFlipped = false;
    render();
  }
}
function toggleShuffle() {
  state.shuffleOn = !state.shuffleOn;
  state.shuffledCards = shuffleArr(getDeck().cards);
  state.practiceIdx = 0; state.isFlipped = false;
  render();
}
function restartPractice() {
  state.practiceIdx = 0; state.isFlipped = false;
  state.shuffledCards = shuffleArr(getDeck().cards);
  render();
}

// ═══════════════════════════════════
//  RENDER — HOME
// ═══════════════════════════════════
function renderHome() {
  const hasDecks = state.decks.length > 0;
  return `
    <div class="site-header">
      <div class="logo-line1">
        <span class="star-blue spin" style="font-size:.8em;">✦</span>
        FLASH<span class="logo-pink-part">CARD</span>
        <span class="star-pink spin" style="font-size:.8em;animation-direction:reverse;">✦</span>
      </div>
      <div class="logo-line2">STUDIO</div>
      <div class="site-tagline">
        <span class="blink star-lime">✶</span>
        自製卡片 &nbsp;·&nbsp; 自我挑戰
        <span class="blink star-lime" style="animation-delay:.9s">✶</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="create-form">
      <input class="y2k-input" id="new-deck-input"
        placeholder="輸入新卡片組名稱（例：日文單字、歷史問答）..."
        style="flex:1;" />
      <button class="btn btn-lime" onclick="handleCreate()">＋ 建立</button>
    </div>

    ${hasDecks ? `
      <p class="section-label"><span class="star-blue">✦</span> 我的卡片組</p>
      <div class="deck-list">
        ${state.decks.map(d => `
          <div class="deck-item">
            <div class="deck-info" onclick="goPractice('${d.id}')">
              <div class="deck-name">${escHtml(d.name)}</div>
              <div class="deck-meta">${d.cards.length} 張卡片</div>
            </div>
            <div class="deck-actions">
              <span class="badge">${d.cards.length}</span>
              <button class="btn btn-blue btn-sm" onclick="goEdit('${d.id}')">編輯</button>
              <button class="btn btn-pink btn-sm" onclick="goPractice('${d.id}')">練習 ▶</button>
              <button class="btn-del" onclick="deleteDeck('${d.id}')" title="刪除卡片組">✕</button>
            </div>
          </div>
        `).join('')}
      </div>
    ` : `
      <div class="empty-state">
        <div class="empty-icon float">🃏</div>
        <div class="empty-text">尚無卡片組<br>建立第一個開始練習吧！</div>
      </div>
    `}

    <div class="divider"></div>
    <div style="text-align:center;">
      <button class="btn btn-clear" onclick="clearAllData()">⚠ 清除所有資料</button>
    </div>
  `;
}

// ═══════════════════════════════════
//  RENDER — EDIT
// ═══════════════════════════════════
function renderEdit() {
  const deck = getDeck();
  if (!deck) return '<p>找不到卡片組</p>';
  return `
    <div style="padding-top:32px;">
      <div class="back-bar">
        <button class="btn btn-ghost btn-sm" onclick="goHome()">← 返回</button>
        <div class="page-title neon-blue">
          <span class="blink star-blue" style="margin-right:8px;">✦</span>
          <input class="deck-name-input"
            value="${escHtml(deck.name)}"
            oninput="updateDeckName('${deck.id}', this.value)"
            aria-label="卡片組名稱" />
        </div>
        ${deck.cards.length > 0 ? `
          <button class="btn btn-pink btn-sm" onclick="goPractice('${deck.id}')">練習 ▶</button>
        ` : ''}
      </div>

      <div class="card-editor-list">
        ${deck.cards.length === 0 ? `
          <div class="empty-state" style="padding:32px 20px;">
            <div class="empty-text">還沒有卡片，點下方新增第一張！</div>
          </div>
        ` : deck.cards.map((c, i) => `
          <div class="card-editor-item">
            <div>
              <div class="field-label label-front">▸ 正面</div>
              <textarea class="y2k-input front-ta" rows="3"
                placeholder="問題、單字、論述題..."
                data-deck="${deck.id}" data-card="${c.id}" data-field="front"
                oninput="handleCardInput(this)">${escHtml(c.front)}</textarea>
            </div>
            <div>
              <div class="field-label label-back">▸ 背面</div>
              <textarea class="y2k-input" rows="3"
                placeholder="答案、解釋、翻譯..."
                data-deck="${deck.id}" data-card="${c.id}" data-field="back"
                oninput="handleCardInput(this)">${escHtml(c.back)}</textarea>
            </div>
            <div class="del-col" style="display:flex;align-items:center;justify-content:center;padding-top:20px;">
              <button class="btn-del" onclick="deleteCard('${deck.id}','${c.id}')" title="刪除此卡">✕</button>
            </div>
          </div>
        `).join('')}
      </div>

      <div style="margin-top:16px;">
        <button class="add-card-btn" onclick="addCard('${deck.id}')">
          <span style="font-size:20px;">＋</span> 新增卡片
        </button>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════
//  RENDER — PRACTICE
// ═══════════════════════════════════
function renderPractice() {
  const deck = getDeck();
  if (!deck) return '';
  const cards = getPracticeCards();
  const total = cards.length;

  if (total === 0) {
    return `
      <div style="padding-top:32px;">
        <div class="back-bar">
          <button class="btn btn-ghost btn-sm" onclick="goHome()">← 返回</button>
        </div>
        <div class="empty-state">
          <div class="empty-icon float">🃏</div>
          <div class="empty-text">這個卡片組還沒有卡片<br>先去編輯加入卡片吧！</div>
          <br>
          <button class="btn btn-blue" onclick="goEdit('${deck.id}')">編輯卡片</button>
        </div>
      </div>
    `;
  }

  // All done
  if (state.practiceIdx >= total) {
    return `
      <div style="padding-top:32px;">
        <div class="back-bar">
          <button class="btn btn-ghost btn-sm" onclick="goHome()">← 返回</button>
        </div>
        <div class="complete-state">
          <div class="complete-icon float">🌟</div>
          <div class="complete-title chrome-text">完成！</div>
          <div class="complete-sub">已完成所有 ${total} 張卡片 ✦</div>
          <div class="complete-btns">
            <button class="btn btn-blue" onclick="restartPractice()">🔄 再來一次</button>
            <button class="btn btn-ghost" onclick="goEdit('${deck.id}')">編輯卡片</button>
            <button class="btn btn-ghost" onclick="goHome()">回首頁</button>
          </div>
        </div>
      </div>
    `;
  }

  const card = cards[state.practiceIdx];
  const pct  = (state.practiceIdx / total) * 100;

  const topBar = `
    <div class="practice-header">
      <button class="btn btn-ghost btn-sm" onclick="goHome()">← 返回</button>
      <div style="font-family:Orbitron,monospace;font-size:12px;font-weight:700;
        background:linear-gradient(135deg,#fff,#a0c8ff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;">
        ${escHtml(deck.name)}
      </div>
      <span class="progress-label">${total} 張</span>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab ${state.practiceMode === 'flip' ? 'active' : ''}" onclick="switchPracticeMode('flip')">▶ 逐張練習</button>
      <button class="mode-tab ${state.practiceMode === 'grid' ? 'active' : ''}" onclick="switchPracticeMode('grid')">⊞ 網格總覽</button>
    </div>
  `;

  if (state.practiceMode === 'grid') {
    return `
      <div style="padding-top:32px;">
        ${topBar}
        <div class="card-grid">
          ${cards.map(c => `
            <div class="grid-card-scene" onclick="toggleGridCard('${c.id}')">
              <div class="grid-card ${state.gridFlipped[c.id] ? 'flipped' : ''}" data-id="${c.id}">
                <div class="grid-face grid-face-front">
                  <div class="grid-card-label">正面</div>
                  <div class="grid-card-text">${escHtml(c.front) || '<span style="opacity:.25;">(空白)</span>'}</div>
                  ${c.front ? `<button class="grid-speak" onclick="event.stopPropagation();speak('${escHtml(c.front).replace(/'/g,"\\'")}')">🔊</button>` : ''}
                </div>
                <div class="grid-face grid-face-back">
                  <div class="grid-card-label" style="color:rgba(255,45,120,.5);">背面</div>
                  <div class="grid-card-text">${escHtml(c.back) || '<span style="opacity:.25;">(空白)</span>'}</div>
                  ${c.back ? `<button class="grid-speak" onclick="event.stopPropagation();speak('${escHtml(c.back).replace(/'/g,"\\'")}')">🔊</button>` : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div style="text-align:center;">
          <button class="btn btn-ghost btn-sm" onclick="goEdit('${deck.id}')">編輯卡片</button>
        </div>
      </div>
    `;
  }

  // ── 逐張模式 ──
  return `
    <div style="padding-top:32px;">
      ${topBar}
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
        <span class="progress-label">${state.practiceIdx + 1} / ${total}</span>
        <div class="shuffle-row" style="margin:0;">
          <span class="toggle-label">亂序</span>
          <div class="toggle-pill ${state.shuffleOn ? 'on' : ''}" onclick="toggleShuffle()" role="switch" aria-checked="${state.shuffleOn}"></div>
        </div>
      </div>

      <div class="flip-scene" onclick="flipCard()" title="點擊翻面">
        <div class="flip-card ${state.isFlipped ? 'flipped' : ''}">
          <div class="flip-face flip-face-front">
            <div class="flip-side-label">正面</div>
            <div class="flip-text">${escHtml(card.front) || '<span style="opacity:.25;">(空白)</span>'}</div>
            <div class="flip-hint">點擊卡片翻面 ✦</div>
          </div>
          <div class="flip-face flip-face-back">
            <div class="flip-side-label" style="color:rgba(255,45,120,.5);">背面</div>
            <div class="flip-text">${escHtml(card.back) || '<span style="opacity:.25;">(空白)</span>'}</div>
            <div class="flip-hint" style="color:rgba(255,45,120,.5);">點擊翻回正面 ✦</div>
          </div>
        </div>
      </div>

      <div style="text-align:center;margin-bottom:14px;">
        <button class="btn-speak" onclick="speakCurrent()">🔊 朗讀</button>
      </div>

      <div class="practice-controls">
        <button class="nav-btn" onclick="prevCard()" ${state.practiceIdx === 0 ? 'disabled' : ''} title="上一張">‹</button>
        <button class="btn btn-pink" onclick="flipCard()" style="min-width:110px;">
          ${state.isFlipped ? '翻回正面' : '翻面看答案'}
        </button>
        <button class="btn ${state.practiceIdx === total - 1 ? 'btn-lime' : 'btn-blue'}" onclick="nextCard()" style="min-width:110px;">
          ${state.practiceIdx === total - 1 ? '完成 ✦' : '下一張 →'}
        </button>
        <button class="nav-btn" onclick="nextCard()" ${state.practiceIdx >= total - 1 ? 'disabled' : ''} title="下一張">›</button>
      </div>

      <div style="text-align:center;margin-top:10px;">
        <button class="btn btn-ghost btn-sm" onclick="goEdit('${deck.id}')">編輯卡片</button>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════
//  BIND EVENTS
// ═══════════════════════════════════
function bindEvents() {
  const inp = document.getElementById('new-deck-input');
  if (inp) {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') handleCreate(); });
  }
}

function handleCreate() {
  const inp = document.getElementById('new-deck-input');
  if (inp && inp.value.trim()) {
    createDeck(inp.value);
    // don't need to clear — render() replaces DOM
  }
}
function handleCardInput(el) {
  const { deck, card, field } = el.dataset;
  updateCard(deck, card, field, el.value);
}

// ═══════════════════════════════════
//  MAIN RENDER
// ═══════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if      (state.view === 'home')     app.innerHTML = renderHome();
  else if (state.view === 'edit')     app.innerHTML = renderEdit();
  else if (state.view === 'practice') app.innerHTML = renderPractice();
  bindEvents();
}

// ═══════════════════════════════════
//  SPEECH
// ═══════════════════════════════════
function speak(text) {
  if (!text || !text.trim()) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text.trim()));
}
function speakCurrent() {
  const cards = getPracticeCards();
  const card = cards[state.practiceIdx];
  if (!card) return;
  speak(state.isFlipped ? card.back : card.front);
}

// ═══════════════════════════════════
//  GRID MODE
// ═══════════════════════════════════
function switchPracticeMode(mode) {
  state.practiceMode = mode;
  state.gridFlipped = {};
  render();
}
function toggleGridCard(cardId) {
  state.gridFlipped[cardId] = !state.gridFlipped[cardId];
  const el = document.querySelector(`.grid-card[data-id="${cardId}"]`);
  if (el) el.classList.toggle('flipped', !!state.gridFlipped[cardId]);
}

// ═══════════════════════════════════
//  CLEAR ALL DATA
// ═══════════════════════════════════
function clearAllData() {
  if (!confirm('確定要清除所有卡片組與卡片資料？\n此操作無法復原。')) return;
  localStorage.removeItem('y2k_flashcards_v1');
  state.decks = [];
  state.activeDeckId = null;
  state.view = 'home';
  render();
}

// ═══════════════════════════════════
//  INIT
// ═══════════════════════════════════
load();
render();
</script>
</body>
</html>
